name: CI/CD pipeline with some MLOps implementation.

on:
  push:
    branches:
      - cloud
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - cloud
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: read
  id-token: write # for Workload Identity Federation GCP

env:
  PROJECT_ID: cloud-agent-conversational
  REGION: us-central1
  SERVICE_NAME: social-agent-cloud
  MODEL_BUCKET: gs://cloud-agent-conversational-models
  CHECKPOINT_DIR: sic_framework/services/nlu/utils/checkpoints

jobs:
  mlops-verify-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./social-interaction-cloud
    env:
      HAS_CLOUD_ACCESS: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            social-interaction-cloud/setup.py
            social-interaction-cloud/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y swi-prolog ffmpeg
          # Single dependency source: setup.py extras (webserver extra reads requirements.txt)
          pip install -e ".[webserver,nlu,dev,text2speech,google-stt]"

      - name: MLOps Gate 1 — Dataset Integrity & Label Conflict Audit
        run: |
          python sic_framework/services/nlu/utils/dataset_audit.py --max_conflicts 0 --max_leakage 0

      - name: Cache Quantized ONNX Model
        id: cache-onnx
        uses: actions/cache@v4
        with:
          path: social-interaction-cloud/sic_framework/services/nlu/utils/checkpoints/bert_nlu_int8.onnx
          key: ${{ runner.os }}-onnx-int8-v1-${{ hashFiles('social-interaction-cloud/sic_framework/services/nlu/utils/data/**', 'social-interaction-cloud/sic_framework/services/nlu/train_and_export.py', 'social-interaction-cloud/sic_framework/services/nlu/utils/dataset.py', 'social-interaction-cloud/sic_framework/services/nlu/utils/tokenization.py') }}

      # always have to authenticate (image push + deploy need it)
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: github.event_name == 'push' || (steps.cache-onnx.outputs.cache-hit != 'true' && env.HAS_CLOUD_ACCESS == 'true')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        if: github.event_name == 'push' || (steps.cache-onnx.outputs.cache-hit != 'true' && env.HAS_CLOUD_ACCESS == 'true')
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch Quantized INT8 ONNX Model from GCS Artifact Bucket
        if: steps.cache-onnx.outputs.cache-hit != 'true' && env.HAS_CLOUD_ACCESS == 'true'
        run: |
          mkdir -p "$CHECKPOINT_DIR"
          echo "Pulling production INT8 ONNX model from $MODEL_BUCKET..."
          if ! gcloud storage cp "$MODEL_BUCKET/bert_nlu_int8.onnx" "$CHECKPOINT_DIR/bert_nlu_int8.onnx"; then
            if [ "${{ github.event_name }}" != "push" ]; then
              echo "::error::No model in $MODEL_BUCKET and training is only allowed on push."
              exit 1
            fi
            echo "No remote model found; training and exporting a fresh INT8 ONNX checkpoint..."
            python sic_framework/services/nlu/train_and_export.py --epochs 5 --batch_size 16
            SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
            # Immutable, commit-tagged artifact + mutable "latest" pointer
            gcloud storage cp "$CHECKPOINT_DIR/bert_nlu_int8.onnx" "$MODEL_BUCKET/bert_nlu_int8_${SHORT_SHA}.onnx"
            gcloud storage cp "$CHECKPOINT_DIR/bert_nlu_int8.onnx" "$MODEL_BUCKET/bert_nlu_int8.onnx"
          fi

      - name: MLOps Gate 2 — Holdout Evaluation & Accuracy/Slot-F1 Thresholds
        if: env.HAS_CLOUD_ACCESS == 'true'
        run: |
          python sic_framework/services/nlu/train_and_export.py --eval_only --min_intent_acc 0.85 --min_slot_f1 0.80

      - name: Notice — Gate 2 skipped for fork PR
        if: env.HAS_CLOUD_ACCESS != 'true'
        run: |
          echo "::notice::MLOps Gate 2 skipped: fork PRs have no access to the model bucket."

      - name: MLOps Gate 3 — Unit Tests & Golden Dialogue Regression Suite
        run: |
          pytest tests/

      - name: Configure Docker for GCP Artifact Registry
        if: github.event_name == 'push'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Production Container Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/my-repo/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/my-repo/${{ env.SERVICE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/my-repo/${{ env.SERVICE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/my-repo/${{ env.SERVICE_NAME }}:buildcache,mode=max


      - name: Deploy Container to Google Cloud Run
        if: github.event_name == 'push'
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/my-repo/${{ env.SERVICE_NAME }}:${{ github.sha }}
          # i use google secret manager
          secrets: |
            ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
            YOUTUBE_API_KEY=YOUTUBE_API_KEY:latest
            ELEVENLABS_API_KEY=ELEVENLABS_API_KEY:latest
            OPENAI_API_KEY=OPENAI_API_KEY:latest
            LANGFUSE_SECRET_KEY=LANGFUSE_SECRET_KEY:latest
            LANGFUSE_PUBLIC_KEY=LANGFUSE_PUBLIC_KEY:latest
          env_vars: |
            LANGFUSE_HOST=https://cloud.langfuse.com
            LANGFUSE_BASE_URL=https://cloud.langfuse.com
            ANTHROPIC_MODEL=claude-haiku-5-5
            HF_HUB_OFFLINE=1
            TRANSFORMERS_OFFLINE=1
          flags: >-
            --allow-unauthenticated
            --memory=4Gi
            --cpu=4
            --timeout=3600
            --min-instances=0
            --max-instances=1
            --cpu-boost
            --no-cpu-throttling

      - name: Ensure Public Invoker IAM Policy
        if: github.event_name == 'push'
        run: |
          gcloud run services add-iam-policy-binding ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --member="allUsers" \
            --role="roles/run.invoker"

      - name: MLOps Gate 4 — Post-Deployment Live HTTP & WebSocket Smoke Tests
        if: github.event_name == 'push'
        env:
          CLOUD_RUN_URL: ${{ steps.deploy.outputs.url }}
        run: |
          pytest tests/test_e2e_cloud_run.py
          echo "Deployed and verified live at ${{ steps.deploy.outputs.url }}"

      - name: Prune Old Artifact Registry Images (Keep 3 Most Recent)
        if: github.event_name == 'push'
        run: |
          echo "Pruning older container images to prevent storage bloat..."
          REPO_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/my-repo/${{ env.SERVICE_NAME }}"
          gcloud artifacts docker images list "$REPO_PATH" \
            --sort-by=~CREATE_TIME \
            --format="value(DIGEST)" | tail -n +4 | while read -r digest; do
              if [ -n "$digest" ]; then
                echo "Deleting old image digest: $digest"
                gcloud artifacts docker images delete "$REPO_PATH@$digest" --delete-tags --quiet || true
              fi
          done

  deploy-homelab:
    needs: [mlops-verify-and-deploy]
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux]
    steps:
      - name: Pull Latest Image and Restart
        working-directory: /home/mikolaj_admin/cookingbroski
        run: |
          docker compose -f docker-compose.homelab.yml pull cookingbroski
          docker compose -f docker-compose.homelab.yml up -d --remove-orphans

      - name: Wait for Local Model Readiness
        run: |
          for i in {1..30}; do
            if docker exec cookingbroski-app python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/ready')" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1

