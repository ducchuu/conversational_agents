<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <title>CookingBroski — Recipe Overview</title>

  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <link rel="stylesheet" href="static/css/bootstrap.min.css">
  <link rel="stylesheet" href="static/css/pca_sleek.css">

  <script src="static/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/jquery-3.7.1.min.js"></script>
  <script src="static/js/socket.io.min.js"></script>
  <script src="static/js/pca.js" defer></script>
</head>

<body>
  <div class="pca-bg" style="background-image:url('static/images/PCAImage3.webp');"></div>
  <div class="pca-overlay"></div>

  <div class="pca-shell" id="main">
    <header class="pca-topbar">
      <nav class="navbar d-flex justify-content-between">
        <div class="pca-brand">
          <div class="pca-logo" aria-hidden="true">🍲</div>
          <div>
            <div class="font-weight-bold">CookingBroski</div>
            <small>Refine your preferences</small>
          </div>
        </div>

        <button class="btn pca-mic pca-mic--sm" id="mic" type="button" aria-label="Microphone">
          <img class="img-fluid" id="micimg" src="static/images/mic_out.png" alt="Microphone">
        </button>
      </nav>
    </header>

    <main class="container py-4 py-md-5 flex-grow-1">
      <div class="pca-card p-3 p-md-4">
        <div class="pca-card-inner p-3 p-md-4">
          <div class="d-flex flex-wrap align-items-center justify-content-between mb-3">
            <div>
              <h2 class="pca-title mb-1">What kind of recipe are you looking for?</h2>
              <div class="pca-muted">
                If there are too many results, add a few more preferences to narrow things down.
              </div>
            </div>
            <span class="pca-chip pca-chip--info">
              <span id="recipecounter">—</span> matches
            </span>
          </div>

          <div class="pca-block mb-3">
            <div class="d-flex align-items-center justify-content-between">
              <div class="font-weight-bold">Filters applied so far</div>
              <span class="pca-muted"><small>Updates live</small></span>
            </div>
            <div class="mt-3">
              <div class="d-flex flex-wrap" id="addFiltersHere"></div>
            </div>
          </div>

          <div class="pca-muted">
            <small>Tip: Try “no garlic”, “with pasta”, “under 20 minutes”, “spicy”, “Italian”…</small>
          </div>

          <!-- Template used by pca.js to render filter chips/cards -->
          <template id="filterCardTemplate">
            <span class="pca-chip mr-2 mb-2" id="filterText">Without garlic</span>
          </template>
        </div>
      </div>
    </main>

    <footer class="pca-footer fixed-bottom">
      <div class="container py-2">
        <p class="lead text-center" style="font-size: 1rem;" id="transcript"></p>
      </div>
    </footer>
  </div>
</body>
</html>
