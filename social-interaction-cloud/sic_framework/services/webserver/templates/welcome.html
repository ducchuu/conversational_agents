<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <title>CookingBroski — Welcome</title>

  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <link rel="stylesheet" href="static/css/bootstrap.min.css">
  <link rel="stylesheet" href="static/css/pca_sleek.css">

  <script src="static/js/jquery-3.7.1.min.js"></script>
  <script src="static/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/socket.io.min.js"></script>
  <script src="static/js/pca.js" defer></script>
</head>

<body>
  <div class="pca-bg" style="background-image:url('static/images/PCAImage1.webp');"></div>
  <div class="pca-overlay"></div>

  <div class="pca-shell" id="main">
    <header class="pca-topbar">
      <nav class="navbar">
        <div class="pca-brand">
          <div class="pca-logo" aria-hidden="true">🍲</div>
          <div>
            <div class="font-weight-bold">CookingBroski</div>
            <small>Say hello to begin</small>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-4 py-md-5 flex-grow-1 d-flex align-items-center">
      <div class="w-100">
        <div class="pca-card p-3 p-md-4 mx-auto" style="max-width: 820px;">
          <div class="pca-card-inner p-3 p-md-4 text-center">
            <span class="pca-chip pca-chip--info mb-3">Welcome</span>

            <h1 class="pca-title mb-2">Hi! I’m CookingBroski 👋</h1>
            <p class="lead pca-muted mb-4" style="max-width: 60ch; margin-left:auto; margin-right:auto;">
              I’m here to help you find the perfect recipe. Tap the microphone and say “Hello” to get started.
            </p>

            <button class="btn pca-mic mx-auto" id="mic" type="button" aria-label="Start speaking" disabled>
              <img class="img-fluid" id="micimg" src="static/images/mic_out.png" alt="Microphone">
            </button>

            <p class="pca-muted mt-3 mb-0"><small>Tap to speak</small></p>
          </div>
        </div>
      </div>
    </main>

    <footer class="pca-footer fixed-bottom">
      <div class="container py-2">
        <p class="lead text-center" style="font-size: 1rem;" id="transcript"></p>
      </div>
    </footer>
  </div>
</body>
</html>
