<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>

        <title>Project Conversational Agents - Welcome</title>

        <!-- Suppress favicon.ico request; https://www.reddit.com/r/flask/comments/aucgy9/template_rendering/ -->
        <link rel="icon" href="data:;base64,iVBORw0KGgo=">

        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="static/css/bootstrap.min.css">

        <!-- jQuery from a CDN -->
        <script src="static/js/jquery-3.7.1.min.js"></script>

        <!-- Bootstrap JS Bundle -->
        <script src="static/js/bootstrap.bundle.min.js"></script>

        <!-- Socket.IO JS Bundle -->
        <script src="static/js/socket.io.min.js"></script>

        <!-- JS for Project Conversational Agents (feel free to add and/or edit) -->
        <script src="static/js/pca.js" defer></script>
	</head>
    <body>
        <div id="main">
            
            <main class="container-fluid d-flex flex-column justify-content-center align-items-center" style="width:100vw; height:100vh">
                
                <img class="bg-image" style="width: 100%; height: 100vh; position: fixed; top: 0; left: 0; z-index: -1; object-fit: cover;" src="https://images.pexels.com/photos/4199098/pexels-photo-4199098.jpeg" alt="Can not show this image">
                
                <div class="text-center p-5 rounded shadow" style="background-color: rgba(255, 255, 255, 0.85); max-width: 600px;">
                    
                    <h1 class="display-4 fw-bold mb-3">Welcome to CookingBroski!</h1>
                    
                    <p class="lead mb-4">
                        I’m here to assist you in finding the perfect recipe. Click the microphone below and say "Hello" to get started!
                    </p>

                    <button class="btn btn-primary rounded-circle p-4" id="mic" style="width: 100px; height: 100px; display: flex; align-items: center; justify-content: center;" type="button" disabled>
                        <img class="img-fluid" style="width: 3rem;" id="micimg" src="static/images/mic_out.png" alt="Can not show this image">
                    </button>
                    
                    <p class="text-muted mt-2"><small>Tap to speak</small></p>
                </div>

            </main>

            <footer class="fixed-bottom">
                <p class="lead mb-0 bg-light text-center py-2" style="min-height:3rem; font-size: 1rem;" id="transcript"></p>
            </footer>

        </div>
    </body>
</html>
