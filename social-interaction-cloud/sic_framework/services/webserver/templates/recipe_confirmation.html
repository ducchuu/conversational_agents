<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <title>CookingBroski — Confirm Recipe</title>

  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <link rel="stylesheet" href="static/css/bootstrap.min.css">
  <link rel="stylesheet" href="static/css/pca_sleek.css">

  <script src="static/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/jquery-3.7.1.min.js"></script>
  <script src="static/js/socket.io.min.js"></script>
  <script src="static/js/pca.js" defer></script>
</head>

<body>
  <div class="pca-bg" style="background-image:url('static/images/PCAImage3.webp');"></div>
  <div class="pca-overlay"></div>

  <div class="pca-shell" id="main">
    <header class="pca-topbar">
      <nav class="navbar d-flex justify-content-between">
        <div class="pca-brand">
          <div class="pca-logo" aria-hidden="true">🍲</div>
          <div>
            <div class="font-weight-bold">CookingBroski</div>
            <small>Confirm or ask for another</small>
          </div>
        </div>

        <button class="btn pca-mic pca-mic--sm" id="mic" type="button" aria-label="Microphone">
          <img class="img-fluid" id="micimg" src="static/images/mic_out.png" alt="Microphone">
        </button>
      </nav>
    </header>

    <main class="container py-4 py-md-5 flex-grow-1">
      <div class="pca-detail" id="recipeDetailCard">
        <div class="pca-detail-media" id="recipeImage" role="img" aria-label="Recipe image"></div>

        <div class="pca-detail-content">
          <div class="d-flex flex-wrap align-items-center justify-content-between mb-2">
            <span class="pca-chip pca-chip--info">Selected recipe</span>
            <div class="d-flex flex-wrap" style="gap:8px;">
              <span class="pca-chip">⏱ <span id="recipeTime">—</span></span>
              <span class="pca-chip">🍽 <span id="recipeServings">—</span></span>
            </div>
          </div>

          <h2 class="pca-title mb-2" id="recipeTitle">Waiting for recipe…</h2>
          <p class="pca-muted mb-3" id="recipeDescription">
            When a recipe is selected, its details will appear here.
          </p>

          <div class="pca-split">
            <div class="pca-block">
              <h5 class="mb-2">Ingredients</h5>
              <ul class="mb-0" id="ingredientsList">
                <li class="pca-muted">—</li>
              </ul>
            </div>

            <div class="pca-block">
              <h5 class="mb-2">Instructions</h5>
              <ol class="mb-0" id="instructionsList">
                <li class="pca-muted">—</li>
              </ol>
            </div>
          </div>

          <div class="mt-3 pca-muted">
            <small>Use the microphone to confirm (“yes”) or ask for another option (“no”).</small>
          </div>
        </div>
      </div>
    </main>

    <footer class="pca-footer fixed-bottom">
      <div class="container py-2">
        <p class="lead text-center" style="font-size: 1rem;" id="transcript"></p>
      </div>
    </footer>
  </div>
</body>
</html>
