<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <title>CookingBroski — Goodbye</title>

  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <link rel="stylesheet" href="static/css/bootstrap.min.css">
  <link rel="stylesheet" href="static/css/pca_sleek.css">

  <script src="static/js/jquery-3.7.1.min.js"></script>
  <script src="static/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/socket.io.min.js"></script>
  <script src="static/js/pca.js" defer></script>
</head>

<body>
  <div class="pca-bg" style="background-image:url('static/images/PCAImage1.webp');"></div>
  <div class="pca-overlay"></div>

  <div class="pca-shell" id="main">
    <header class="pca-topbar">
      <nav class="navbar">
        <div class="pca-brand">
          <div class="pca-logo" aria-hidden="true">🍲</div>
          <div>
            <div class="font-weight-bold">CookingBroski</div>
            <small>Thanks for cooking with me</small>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-5 flex-grow-1 d-flex align-items-center">
      <div class="w-100">
        <div class="pca-card p-3 p-md-4 mx-auto" style="max-width: 820px;">
          <div class="pca-card-inner p-3 p-md-4 text-center">
            <span class="pca-chip pca-chip--info mb-3">Closing</span>

            <div style="font-size:3.2rem; margin-bottom: 12px;" aria-hidden="true">👩‍🍳</div>

            <h1 class="pca-title mb-2">Thank you for exploring recipes with us!</h1>
            <p class="lead pca-muted mb-3">We hope you found something delicious.</p>

            <p class="pca-muted mb-0">
              Feel free to start a new session any time to discover more recipes you’ll love.
            </p>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
