[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["social_interaction_cloud.egg-info", "sic_framework/services/webserver/static"]

[tool.ruff.lint]
# Correctness-focused rule set (pyflakes + pycodestyle errors); style rules left to black/isort.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export their service module via star-import (SIC framework convention).
"__init__.py" = ["F401", "F403"]
# Entry points that must patch sys.path / load .env before importing project modules.
"sic_framework/services/webserver/webserver_pca.py" = ["E402"]
"sic_framework/services/nlu/train_and_export.py" = ["E402"]
# Vendored legacy SIC framework services (not part of the deployed pipeline).
"sic_framework/services/dialogflow/*.py" = ["F401", "F841"]
"sic_framework/services/google_stt/*.py" = ["E711"]
"sic_framework/services/text2speech/*.py" = ["F401"]
"sic_framework/services/openai_whisper_speech_to_text/*.py" = ["F401"]

[tool.pytest.ini_options]
# Silence upstream third-party deprecation warning from tokenizers (BertWordPieceTokenizer internally invokes WordPiece)
filterwarnings = [
    "ignore:.*WordPiece.__init__ will not create from files anymore.*:DeprecationWarning",
]

